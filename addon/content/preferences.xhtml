<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-general-title"></html:h2></label>
  <checkbox id="ztr-enable" preference="enable" data-l10n-id="pref-enable" />
  <hbox align="center" pack="start">
    <html:label data-l10n-id="pref-target-lang"></html:label>
    <html:input type="text" preference="targetLang" style="width: 10em" />
    <html:label data-l10n-id="pref-source-lang"></html:label>
    <html:input type="text" preference="sourceLang" style="width: 8em" />
  </hbox>
  <hbox align="center" pack="start">
    <html:label data-l10n-id="pref-timeout"></html:label>
    <html:input
      type="number"
      preference="translate.timeout"
      style="width: 8em"
    />
    <html:label data-l10n-id="pref-chunk-size"></html:label>
    <html:input
      type="number"
      preference="translate.chunkMaxChars"
      style="width: 8em"
    />
  </hbox>
  <checkbox
    preference="translate.autoOnSelect"
    data-l10n-id="pref-auto-on-select"
  />
  <hbox align="center" pack="start">
    <html:label data-l10n-id="pref-auto-debounce"></html:label>
    <html:input
      type="number"
      preference="translate.autoDebounceMs"
      style="width: 8em"
    />
  </hbox>
  <checkbox
    preference="translate.contextAware"
    data-l10n-id="pref-context-aware"
  />
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pref-channels-title"></html:h2></label>
  <html:div id="ztr-channel-order" class="ztr-prefs-list" />
  <html:div data-l10n-id="pref-channels-order-hint"></html:div>
  <checkbox preference="bing.enabled" data-l10n-id="pref-bing-enabled" />
  <hbox align="center" pack="start">
    <html:label data-l10n-id="pref-bing-mode"></html:label>
    <html:select id="ztr-bing-mode" preference="bing.mode" style="width: 12em">
      <html:option value="edge" data-l10n-id="pref-bing-mode-edge" />
      <html:option value="azure" data-l10n-id="pref-bing-mode-azure" />
    </html:select>
  </hbox>
  <vbox id="ztr-bing-azure">
    <hbox align="center" pack="start">
      <html:label data-l10n-id="pref-azure-key"></html:label>
      <html:input
        type="password"
        preference="bing.azureKey"
        style="width: 30em"
      />
    </hbox>
    <hbox align="center" pack="start">
      <html:label data-l10n-id="pref-azure-region"></html:label>
      <html:input
        type="text"
        preference="bing.azureRegion"
        style="width: 12em"
      />
    </hbox>
  </vbox>
  <checkbox
    preference="deepseek.enabled"
    data-l10n-id="pref-deepseek-enabled"
  />
  <hbox align="center" pack="start">
    <html:label data-l10n-id="pref-deepseek-key"></html:label>
    <html:input
      type="password"
      preference="deepseek.apiKey"
      style="width: 30em"
    />
  </hbox>
  <hbox align="center" pack="start">
    <html:label data-l10n-id="pref-deepseek-baseurl"></html:label>
    <html:input type="text" preference="deepseek.baseURL" style="width: 30em" />
    <html:label data-l10n-id="pref-deepseek-model"></html:label>
    <html:input type="text" preference="deepseek.model" style="width: 14em" />
  </hbox>
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pref-custom-channels-title"></html:h2></label>
  <html:div id="ztr-custom-channels" class="ztr-prefs-list" />
  <hbox align="center" pack="start">
    <html:input
      type="text"
      id="ztr-custom-name"
      placeholder="Name"
      style="width: 10em"
    />
    <html:input
      type="text"
      id="ztr-custom-baseurl"
      placeholder="https://api.example.com/v1"
      style="width: 22em"
    />
    <html:input
      type="password"
      id="ztr-custom-key"
      placeholder="API Key"
      style="width: 16em"
    />
    <html:input
      type="text"
      id="ztr-custom-model"
      placeholder="model"
      style="width: 10em"
    />
    <html:button
      id="ztr-add-channel"
      class="small-button"
      data-l10n-id="pref-add-channel"
    />
  </hbox>
  <html:div data-l10n-id="pref-privacy-hint"></html:div>
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pref-shortcuts-title"></html:h2></label>
  <hbox align="center" pack="start">
    <html:label data-l10n-id="pref-shortcut-translate"></html:label>
    <html:input
      type="text"
      id="ztr-shortcut-translate"
      readonly="true"
      style="width: 16em"
    />
  </hbox>
  <hbox align="center" pack="start">
    <html:label data-l10n-id="pref-shortcut-summary"></html:label>
    <html:input
      type="text"
      id="ztr-shortcut-summary"
      readonly="true"
      style="width: 16em"
    />
  </hbox>
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pref-format-title"></html:h2></label>
  <checkbox
    preference="formatter.mergeLineBreaks"
    data-l10n-id="pref-fmt-merge"
  />
  <checkbox
    preference="formatter.fixHyphenation"
    data-l10n-id="pref-fmt-hyphen"
  />
  <checkbox
    preference="formatter.normalizeQuotes"
    data-l10n-id="pref-fmt-quotes"
  />
  <checkbox
    preference="formatter.normalizeDashes"
    data-l10n-id="pref-fmt-dashes"
  />
  <checkbox
    preference="formatter.normalizeWidth"
    data-l10n-id="pref-fmt-width"
  />
  <checkbox
    preference="formatter.collapseWhitespace"
    data-l10n-id="pref-fmt-space"
  />
  <checkbox
    preference="formatter.normalizeSymbols"
    data-l10n-id="pref-fmt-symbols"
  />
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pref-history-title"></html:h2></label>
  <checkbox preference="cacheEnabled" data-l10n-id="pref-cache-enabled" />
  <hbox align="center" pack="start">
    <html:label data-l10n-id="pref-history-capacity"></html:label>
    <html:input type="number" preference="historyCapacity" style="width: 8em" />
  </hbox>
  <html:button
    id="ztr-clear-history"
    class="danger-button"
    data-l10n-id="pref-clear-history"
  />
</groupbox>
